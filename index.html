<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jofin F Archbald — Data Engineer</title>
  <meta name="description" content="Portfolio of Jofin F Archbald, Data Engineer — production data pipelines, Databricks, PySpark.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- watercolor splashes: turbulence-distorted paint blobs + spatter dots -->
  <svg class="splashes" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="wc-a" x="-60%" y="-60%" width="220%" height="220%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="72"/>
      </filter>
      <filter id="wc-b" x="-60%" y="-60%" width="220%" height="220%">
        <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="3" seed="23" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="88"/>
      </filter>
    </defs>

    <!-- top right, cyan over teal -->
    <g filter="url(#wc-a)">
      <ellipse cx="88%" cy="5%" rx="170" ry="115" fill="#8cc8d2" opacity="0.16"/>
      <ellipse cx="91%" cy="8%" rx="105" ry="70" fill="#4e9da8" opacity="0.12"/>
    </g>
    <!-- mid left, soft blue -->
    <g filter="url(#wc-b)">
      <ellipse cx="3%" cy="36%" rx="130" ry="95" fill="#7896bf" opacity="0.11"/>
      <ellipse cx="1%" cy="39%" rx="80" ry="55" fill="#8cc8d2" opacity="0.10"/>
    </g>
    <!-- mid right, faint teal -->
    <g filter="url(#wc-a)">
      <ellipse cx="97%" cy="62%" rx="115" ry="150" fill="#4e9da8" opacity="0.09"/>
    </g>
    <!-- bottom left, cyan over deep teal -->
    <g filter="url(#wc-b)">
      <ellipse cx="9%" cy="90%" rx="155" ry="105" fill="#8cc8d2" opacity="0.15"/>
      <ellipse cx="5%" cy="94%" rx="90" ry="60" fill="#257d8b" opacity="0.08"/>
    </g>

    <!-- paint spatter -->
    <g fill="#2e8494" opacity="0.30">
      <circle cx="77%" cy="13%" r="2.3"/>
      <circle cx="82%" cy="18%" r="1.3"/>
      <circle cx="72%" cy="8%" r="1.6"/>
      <circle cx="94%" cy="22%" r="1.9"/>
      <circle cx="12%" cy="27%" r="1.5"/>
      <circle cx="7%" cy="50%" r="2.0"/>
      <circle cx="16%" cy="80%" r="1.4"/>
      <circle cx="22%" cy="93%" r="2.2"/>
      <circle cx="88%" cy="75%" r="1.5"/>
      <circle cx="93%" cy="52%" r="1.3"/>
    </g>
  </svg>

  <header class="topbar">
    <span class="monogram">JFA</span>
  </header>

  <main id="app">
    <noscript><p style="padding:2rem">This page needs JavaScript to render resume data.</p></noscript>
  </main>

  <footer class="footer">
    <p id="footer-note"></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
